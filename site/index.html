<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascadia Security Leadership Council</title>
    <meta
      name="description"
      content="A Seattle-area peer community for nonprofit leaders building strategies and operational playbooks for current and future cybersecurity threats."
    />

    <link rel="canonical" href="https://cascadia-security-union.vercel.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cascadia Security Leadership Council" />
    <meta property="og:title" content="Cascadia Security Leadership Council" />
    <meta
      property="og:description"
      content="A Seattle-area peer community for nonprofit leaders building strategies and operational playbooks for current and future cybersecurity threats."
    />
    <meta property="og:url" content="https://cascadia-security-union.vercel.app/" />
    <meta property="og:image" content="https://cascadia-security-union.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Cascadia Security Leadership Council — nonprofit cybersecurity strategies and playbooks" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cascadia Security Leadership Council" />
    <meta
      name="twitter:description"
      content="A Seattle-area peer community for nonprofit leaders building strategies and operational playbooks for current and future cybersecurity threats."
    />
    <meta name="twitter:image" content="https://cascadia-security-union.vercel.app/og-image.png" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>

    <header class="site-header">
      <p class="eyebrow" data-bind="header.eyebrow"></p>
      <h1 data-bind="header.title"></h1>
      <p class="lede" data-bind="header.lede"></p>
      <div class="header-actions">
        <a class="button primary" data-bind-href="header.primaryCta.href" data-bind="header.primaryCta.label"></a>
        <a class="button ghost" data-bind-href="header.secondaryCta.href" data-bind="header.secondaryCta.label"></a>
      </div>
    </header>

    <main>
      <section class="panel" id="value">
        <h2 data-bind="value.title"></h2>
        <div class="grid two" data-list="value.items" data-template="value-item"></div>
      </section>

      <section class="panel" id="program">
        <h2 data-bind="program.title"></h2>
        <div class="timeline" data-list="program.items" data-template="program-item"></div>
      </section>

      <section class="panel" id="themes">
        <h2 data-bind="themes.title"></h2>
        <div class="chips" id="theme-chips" data-list="themes.items" data-template="theme-chip" aria-live="polite"></div>
      </section>

      <section class="panel" id="apply">
        <h2 data-bind="apply.title"></h2>
        <ul class="criteria-list" data-list="apply.criteria" data-template="criterion"></ul>
        <p class="contact" data-bind="apply.cohortNote"></p>

        <div class="invite" id="invite">
          <h3 data-bind="invite.title"></h3>
          <p class="invite-lede" data-bind="invite.lede"></p>

          <form class="invite-form" id="invite-form" novalidate>
            <div class="form-row">
              <label for="invite-name">
                <span data-bind="invite.fields.name"></span>
                <input id="invite-name" name="name" type="text" autocomplete="name" required maxlength="120" />
              </label>
              <label for="invite-email">
                <span data-bind="invite.fields.email"></span>
                <input id="invite-email" name="email" type="email" autocomplete="email" required maxlength="200" />
              </label>
            </div>

            <div class="form-row">
              <label for="invite-organization">
                <span data-bind="invite.fields.organization"></span>
                <input id="invite-organization" name="organization" type="text" autocomplete="organization" required maxlength="200" />
              </label>
              <label for="invite-role">
                <span data-bind="invite.fields.role"></span>
                <input id="invite-role" name="role" type="text" autocomplete="organization-title" required maxlength="120" />
              </label>
            </div>

            <label for="invite-notes">
              <span data-bind="invite.fields.notes"></span>
              <textarea id="invite-notes" name="notes" rows="4" maxlength="1000"></textarea>
            </label>

            <label for="invite-challenge" class="invite-challenge">
              <span id="invite-challenge-label" data-bind="invite.fields.challenge"></span>
              <input
                id="invite-challenge"
                name="challenge_answer"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                required
                maxlength="16"
              />
            </label>

            <input type="hidden" name="form_token" id="invite-form-token" value="" />
            <input type="hidden" name="challenge_token" id="invite-challenge-token" value="" />

            <!-- Honeypot: leave empty -->
            <label class="hp" for="invite-company" aria-hidden="true">
              Company
              <input id="invite-company" name="company" type="text" tabindex="-1" autocomplete="off" />
            </label>

            <div class="form-actions">
              <button class="button primary" type="submit" data-bind="invite.submitLabel"></button>
              <p class="form-status" id="invite-status" role="status" aria-live="polite" hidden></p>
            </div>
          </form>
        </div>
      </section>

      <section class="panel faq" id="faq">
        <h2 data-bind="faq.title"></h2>
        <div data-list="faq.items" data-template="faq-item"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p data-bind="footer.text"></p>
    </footer>

    <template id="value-item">
      <article>
        <h3 data-field="title"></h3>
        <p data-field="body"></p>
      </article>
    </template>

    <template id="program-item">
      <div class="timeline-item">
        <h3 data-field="title"></h3>
        <p data-field="body"></p>
      </div>
    </template>

    <template id="theme-chip">
      <span class="chip" data-field="."></span>
    </template>

    <template id="criterion">
      <li data-field="."></li>
    </template>

    <template id="faq-item">
      <button class="faq-item" type="button" aria-expanded="false">
        <span data-field="question"></span>
      </button>
      <div class="faq-answer" hidden data-field="answer"></div>
    </template>

    <script src="content.js"></script>
    <script src="script.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
